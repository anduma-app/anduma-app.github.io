# Web app (build Flutter web del client) pubblicata su GitHub Pages:
#   https://emanueledri.github.io/anduma/  oppure, col dominio personalizzato, https://anduma.is-a.dev/
# Il base href viene da configure-pages: "/anduma/" senza dominio, "/" con il dominio.
# Parla con il backend su Render; le origini sono ammesse via TT_CORS_ORIGINS (render.yaml).
name: Web app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Build
        working-directory: mobile
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/" \
            --dart-define=TT_API_BASE=https://transito-torino.onrender.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
