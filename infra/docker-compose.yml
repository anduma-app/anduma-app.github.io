# Stack locale: PostgreSQL + Redis.
# Avvio:  docker compose -f infra/docker-compose.yml up -d
# Il backend (uvicorn locale) vi si collega via:
#   TT_DATABASE_URL=postgresql+psycopg://transito:transito@localhost:5432/transito
#   TT_REDIS_URL=redis://localhost:6379/0
#
# Stack completo come in produzione (API + worker in container), profilo "app":
#   docker compose -f infra/docker-compose.yml --profile app up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: transito-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transito}
      POSTGRES_DB: ${POSTGRES_DB:-transito}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transito} -d ${POSTGRES_DB:-transito}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: transito-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["app"]
    build: ../backend
    environment: &backend-env
      TT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-transito}:${POSTGRES_PASSWORD:-transito}@postgres:5432/${POSTGRES_DB:-transito}
      TT_REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Scheduler alert + push: una sola replica. Per l'invio reale servono
  # TT_FCM_ENABLED=true e la service account montata (vedi docs/FIREBASE_SETUP.md).
  worker:
    profiles: ["app"]
    build: ../backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
